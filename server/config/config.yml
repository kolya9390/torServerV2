# TorrServer Configuration
# This file contains default settings for TorrServer

server:
  # HTTP Server
  port: "8090"
  # HTTP Authentication (for API access)
  http_auth: false
  # HTTPS (TLS/SSL)
  ssl: false
  ssl_port: "8091"
  ssl_cert: ""
  ssl_key: ""
  # Shutdown mode: local|public
  shutdown_mode: "local"

dlna:
  enabled: false
  friendly_name: "TorrServer"

cache:
  size_mb: 64  # Cache size in MB
  preload_percent: 50  # Preload cache percentage
  use_disk: false
  torrents_save_path: ""  # Leave empty to use memory only

torrent:
  force_encrypt: false
  retrackers_mode: 1  # 0=don't add, 1=add, 2=remove, 3=replace
  disconnect_timeout_sec: 30
  connections_limit: 25

network:
  enable_ipv6: true
  disable_tcp: false
  disable_utp: false
  disable_upnp: false
  disable_dht: false
  disable_pex: false
  disable_upload: false
  download_rate_limit_kb: 0  # 0 = unlimited
  upload_rate_limit_kb: 0
  peers_listen_port: 0  # 0 = random port
  enable_lpd: false  # BEP-14 Local Peer Discovery; enable only for measured home/LAN experiments
  lpd_ipv6: false  # IPv6 LPD is opt-in; requires enable_ipv6=true

search:
  enable_rutor: false
  enable_torznab: false
  torznab_urls: []

streaming:
  responsive_mode: true
  # Allowed: custom, balanced, tcp-only-balanced, low-cpu, low-end, high-throughput, nas
  # custom is the compatibility default: TCP/uTP/DHT/PEX stay enabled for broad peer reach.
  # tcp-only-balanced is the measured recommended profile for heavy home streaming when uTP CPU is too high.
  # low-cpu is opt-in for CPU-constrained deployments; it is not recommended for heavy/default playback.
  core_profile: "custom"
  max_concurrent_streams: 0  # 0 = auto
  stream_queue_size: 0  # 0 = auto
  stream_queue_wait_sec: 3
  max_unique_playback_torrents: 0  # 0 = compatibility default; tcp-only-balanced profile uses 2
  startup_preload_policy: "skip-active"  # skip-active avoids preload competing with active playback; legacy restores old multi-only skip
  adaptive_ra_min_mb: 4
  adaptive_ra_max_mb: 64
  read_ahead_percent: 95  # 5-100%

disk_cache:
  warm_size_mb: 0  # 0 = disabled
  warm_ttl_min: 180
  sync_policy: "periodic"  # none, periodic, always
  sync_interval_ms: 1000
  write_batch_size: 16

workers:
  metadata_workers: 0  # 0 = auto
  metadata_queue_size: 0  # 0 = auto
  preload_workers: 0  # 0 = auto
  preload_queue_size: 0  # 0 = auto

debug:
  enabled: false  # Release-safe default. Set true only for local profiling: /debug/pprof/* and /debug/vars
  service_only: false  # Set true locally for V2 debug logs without library spam or HTTP debug endpoints
  show_fs_active_torr: false
  established_conns_per_torrent_override: 0  # Local profiling only. Ignored unless debug.enabled=true.
  total_half_open_conns_override: 0  # Local profiling only. Try 500 for TorrServer-like peer acquisition.
  tracker_budget_override: 0  # Local profiling only. 0 keeps profile policy; ignored unless debug.enabled=true.
  stable_peer_cap: 0  # Local A/B only. 0 disables stable multi-stream peer relief.
  max_unverified_bytes_mb: 0  # Local profiling only. 0 keeps anacrolix default; ignored unless debug.enabled=true.

proxy:
  enabled: false
  hosts:
    - "*themoviedb.org"
    - "*tmdb.org"
    - "rutor.info"

storage:
  settings_in_json: true  # true = JSON, false = BBolt
  viewed_in_json: false  # true = JSON, false = BBolt
