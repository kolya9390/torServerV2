name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Test release helpers
        run: make test-release

      - name: Validate release tag
        id: tag
        run: ./.github/scripts/validate-release-tag.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        run: >-
          ./.github/scripts/extract-release-notes.sh CHANGELOG.md
          "${{ steps.tag.outputs.version }}" /tmp/release-notes.md

  test:
    name: Tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Run tests with race detector
        working-directory: server
        run: go test -race ./...

      - name: Run split-process smoke test
        run: make e2e

  lint:
    name: Lint
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          working-directory: server
          args: --timeout=10m

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [validate, test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Build release binaries
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: >-
          ./.github/scripts/build-release-binary.sh . dist "$RELEASE_VERSION"
          "${{ github.sha }}" "${{ matrix.goos }}" "${{ matrix.goarch }}"

      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/torrserver-${{ needs.validate.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}*
            dist/torrctl-${{ needs.validate.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub prerelease or release
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-binaries-*
          path: artifacts

      - name: Prepare checksummed release assets
        run: >-
          ./.github/scripts/prepare-release-assets.sh artifacts release
          "${{ needs.validate.outputs.version }}"

      - name: Verify embedded build metadata
        run: >-
          ./.github/scripts/verify-release-binaries.sh release
          "${{ needs.validate.outputs.version }}" "${{ github.sha }}"

      - name: Package platform distributions
        run: >-
          ./.github/scripts/package-release-bundles.sh . release
          "${{ needs.validate.outputs.version }}"

      - name: Verify platform distributions
        run: >-
          ./.github/scripts/verify-release-bundles.sh . release
          "${{ needs.validate.outputs.version }}" "${{ github.sha }}"

      - name: Prepare release notes
        run: >-
          ./.github/scripts/extract-release-notes.sh CHANGELOG.md
          "${{ needs.validate.outputs.version }}" release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Release $RELEASE_TAG" \
            --notes-file release-notes.md \
            "${flags[@]}" \
            release/*

  docker:
    name: Publish release container
    needs: [validate, release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      release_tag: ${{ needs.validate.outputs.tag }}
      release_sha: ${{ github.sha }}
      prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
