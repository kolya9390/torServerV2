name: Docker Release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Validated SemVer release tag
        required: true
        type: string
      release_sha:
        description: Commit referenced by the release tag
        required: true
        type: string
      prerelease:
        description: Whether the release is an alpha, beta, or RC
        required: true
        type: boolean

jobs:
  publish:
    name: Publish release image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }},enable=${{ inputs.prerelease == false }}
            type=semver,pattern={{major}},value=${{ inputs.release_tag }},enable=${{ inputs.prerelease == false }}
            type=raw,value=latest,enable=${{ inputs.prerelease == false }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ inputs.release_tag }}
            COMMIT=${{ inputs.release_sha }}
            BUILD_TIME=unknown
            DIRTY=clean
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
